{% extends "base.html" %}
{% block content %}
<div class="form-page-wide">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">Reply to {{ original.sender_name }}</h1>
            <div class="quote-box mb-3">
                <p class="mb-1"><strong>Original message:</strong></p>
                <p class="mb-0">{{ original.body }}</p>
            </div>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Reply</label>
                    <textarea class="form-control" name="body" rows="5" required></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Send Reply</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('inbox') }}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
